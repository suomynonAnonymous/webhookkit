[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "webhookkit"
version = "0.1.2"
description = "Framework-agnostic webhook toolkit — send, receive, verify, and retry webhooks with ease"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "suomynonAnonymous", email = "suomynonAnonymous@users.noreply.github.com"},
]
keywords = [
    "webhook",
    "webhooks",
    "hmac",
    "signature",
    "verification",
    "stripe",
    "github",
    "shopify",
    "slack",
    "retry",
    "event",
    "api",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
async = ["httpx>=0.24"]
validation = ["pydantic>=2.0"]
all = ["httpx>=0.24", "pydantic>=2.0"]
dev = [
    "pytest>=7.0",
    "pytest-asyncio>=0.21",
    "pytest-cov>=4.0",
    "ruff>=0.4.0",
    "mypy>=1.0",
    "httpx>=0.24",
    "respx>=0.20",
]

[project.urls]
Homepage = "https://github.com/suomynonAnonymous/webhookkit"
Documentation = "https://github.com/suomynonAnonymous/webhookkit#readme"
Repository = "https://github.com/suomynonAnonymous/webhookkit"
Issues = "https://github.com/suomynonAnonymous/webhookkit/issues"
Changelog = "https://github.com/suomynonAnonymous/webhookkit/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/webhookkit"]

[tool.ruff]
line-length = 120
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["webhookkit"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
addopts = "-v --tb=short"
asyncio_mode = "auto"

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.coverage.run]
source = ["webhookkit"]
omit = ["tests/*"]

[tool.coverage.report]
show_missing = true
fail_under = 90
